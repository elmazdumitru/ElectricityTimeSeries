# Local development: the API at http://localhost:5020 on SQL Server, in Development, with tokens from
# dotnet user-jwts, and the Aspire dashboard at http://localhost:18888 showing its logs, traces and metrics.
# Start it with scripts/Start-SqlServer.ps1. Data is kept in the sqlserver-data volume between runs.

name: electricity-timeseries-local

# Local only: SQL Server is reachable from this machine alone (see its ports).
x-sql-server:
  password: &password "Local-dev-1"
  connection-string: &connection-string "Server=sqlserver;Database=ElectricityTimeSeries;User Id=sa;Password=Local-dev-1;TrustServerCertificate=True"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      Storage__Provider: SqlServer
      Storage__ConnectionString: *connection-string
    depends_on:
      dashboard:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    ports:
      # Its own port, so it runs next to dotnet run (5021, 7244).
      - "5020:8080"
    volumes:
      # The dotnet user-jwts signing key lives in the host's user secrets.
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *password
    ports:
      # For SQL Server Management Studio or similar: localhost,14330
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      retries: 30
      start_period: 10s

  # Creates or updates the tables, then exits. The API waits for it.
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    command: ["--connection", *connection-string]
    depends_on:
      sqlserver:
        condition: service_healthy

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      # No login: it's only reachable from this machine (see the ports).
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      # Where telemetry goes in. dotnet run and Visual Studio send here too.
      - "127.0.0.1:4317:18889"

  # Reads SQL Server's own metrics and most expensive queries, and passes them on to the dashboard.
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    environment:
      SQLSERVER_PASSWORD: *password
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      dashboard:
        condition: service_started

volumes:
  sqlserver-data:
