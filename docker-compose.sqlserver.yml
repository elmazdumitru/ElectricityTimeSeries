# The same as docker-compose.yml, but stored in SQL Server, with SQL Server's own metrics in the dashboard:
#   docker compose -f docker-compose.yml -f docker-compose.sqlserver.yml up --build
# Data is kept in the sqlserver-data volume. To start from scratch, add --volumes to "down".

# Local only: SQL Server is reachable from this machine alone (see its ports).
x-sql-server:
  password: &password "Local-dev-1"
  connection-string: &connection-string "Server=sqlserver;Database=ElectricityTimeSeries;User Id=sa;Password=Local-dev-1;TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *password
    ports:
      # For SQL Server Management Studio or similar: localhost,14330
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      retries: 30
      start_period: 10s

  # Creates or updates the tables, then exits. The API waits for it.
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    command: ["--connection", *connection-string]
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    environment:
      Storage__Provider: SqlServer
      Storage__ConnectionString: *connection-string
    depends_on:
      migrations:
        condition: service_completed_successfully

  # Reads SQL Server's own metrics and most expensive queries, and passes them on to the dashboard.
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    environment:
      SQLSERVER_PASSWORD: *password
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      dashboard:
        condition: service_started

volumes:
  sqlserver-data:
