<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Solution architecture</title>
  <desc id="desc">Api and Infrastructure both depend on Core. Api references Infrastructure only in Program.cs, to wire it up at startup. Infrastructure stores data in memory or in SQL Server.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e" />
    </marker>
  </defs>

  <!-- Core -->
  <rect x="265" y="20" width="230" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="380" y="52" text-anchor="middle" font-size="18" font-weight="600" fill="#1e3a8a">Core</text>
  <text x="380" y="76" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Domain, rules, services, interfaces</text>

  <!-- Api -->
  <rect x="20" y="190" width="220" height="76" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <text x="130" y="222" text-anchor="middle" font-size="18" font-weight="600" fill="#14532d">Api</text>
  <text x="130" y="246" text-anchor="middle" font-size="12.5" fill="#14532d">Endpoints, contracts, startup</text>

  <!-- Infrastructure -->
  <rect x="380" y="190" width="220" height="76" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
  <text x="490" y="222" text-anchor="middle" font-size="18" font-weight="600" fill="#78350f">Infrastructure</text>
  <text x="490" y="246" text-anchor="middle" font-size="12.5" fill="#78350f">EF Core, repository</text>

  <!-- Storage -->
  <path d="M 640 196 v 66 a 60 12 0 0 0 120 0 v -66" fill="#e5e7eb" stroke="#6b7280" stroke-width="2" />
  <ellipse cx="700" cy="196" rx="60" ry="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" />
  <text x="700" y="230" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Storage</text>
  <text x="700" y="248" text-anchor="middle" font-size="11.5" fill="#1f2937">In memory or</text>
  <text x="700" y="262" text-anchor="middle" font-size="11.5" fill="#1f2937">SQL Server</text>

  <!-- Dependencies -->
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <path d="M 150 190 L 300 100" marker-end="url(#arrow)" />
    <path d="M 470 190 L 420 100" marker-end="url(#arrow)" />
    <path d="M 240 228 L 374 228" stroke-dasharray="6 5" marker-end="url(#arrow)" />
    <path d="M 600 228 L 634 228" marker-end="url(#arrow)" />
  </g>
  <text x="307" y="218" text-anchor="middle" font-size="12" fill="#8b949e">Program.cs only</text>

  <text x="390" y="292" text-anchor="middle" font-size="11.5" fill="#8b949e">Arrows point from a project to what it depends on.</text>
</svg>
