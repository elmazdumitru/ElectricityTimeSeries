name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test --project tests/ElectricityTimeSeries.UnitTests
          --configuration Release --no-build
          --report-xunit-trx --results-directory TestResults/unit

      - name: Integration tests (in-memory storage)
        run: >-
          dotnet test --project tests/ElectricityTimeSeries.Api.IntegrationTests
          --configuration Release --no-build
          --report-xunit-trx --results-directory TestResults/in-memory

      # The tests start SQL Server themselves (Testcontainers); the runner only needs Docker.
      - name: Integration tests (SQL Server)
        env:
          TEST_STORAGE: SqlServer
        run: >-
          dotnet test --project tests/ElectricityTimeSeries.Api.IntegrationTests
          --configuration Release --no-build
          --report-xunit-trx --results-directory TestResults/sql-server

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit-integration
          path: TestResults
          if-no-files-found: ignore
