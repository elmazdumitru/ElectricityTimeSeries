# Build, unit tests, then integration tests in memory and on SQL Server (started by the tests; needs Docker).

trigger:
  branches:
    include:
      - main

# Azure Repos ignores this: there, add a build validation branch policy on main instead.
pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  testResults: $(Agent.TempDirectory)/TestResults
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

steps:
  - task: UseDotNet@2
    displayName: Install the .NET SDK from global.json
    inputs:
      useGlobalJson: true

  - script: dotnet restore
    displayName: Restore

  - script: dotnet build --configuration $(buildConfiguration) --no-restore
    displayName: Build

  - script: >-
      dotnet test --project tests/ElectricityTimeSeries.UnitTests
      --configuration $(buildConfiguration) --no-build
      --report-xunit-trx --results-directory $(testResults)/unit
    displayName: Unit tests

  - script: >-
      dotnet test --project tests/ElectricityTimeSeries.Api.IntegrationTests
      --configuration $(buildConfiguration) --no-build
      --report-xunit-trx --results-directory $(testResults)/in-memory
    displayName: Integration tests (in-memory storage)

  - script: >-
      dotnet test --project tests/ElectricityTimeSeries.Api.IntegrationTests
      --configuration $(buildConfiguration) --no-build
      --report-xunit-trx --results-directory $(testResults)/sql-server
    displayName: Integration tests (SQL Server)
    env:
      TEST_STORAGE: SqlServer

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      searchFolder: $(testResults)
      mergeTestResults: false
